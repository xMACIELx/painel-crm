<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Painel CRM</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; padding: 16px; background: #1a1a1a; color: #eee; box-sizing: border-box; }
  body.modo-iframe { padding: 0; }
  #conteudo { min-height: calc(100% - 32px); }
  body.modo-iframe #conteudo { height: 100%; min-height: 100%; }
  .card { background: #262626; border-radius: 8px; padding: 16px; }
  .estado { color: #999; font-size: 13px; }
  .botao { background: #7dd3fc; color: #111; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  .botao:disabled { opacity: 0.6; cursor: default; }
  a { color: #7dd3fc; }
  .lista-duplicados { list-style: none; padding: 0; margin: 12px 0; }
  .lista-duplicados li { padding: 8px 0; border-bottom: 1px solid #333; }
  .lista-duplicados li:last-child { border-bottom: none; }
  .aviso { font-size: 13px; color: #ccc; margin-top: 12px; }
  .twenty-frame { width: 100%; height: 100%; border: 0; display: block; }
  .debug { margin-top: 16px; font-size: 11px; color: #666; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <div id="conteudo" class="estado">Aguardando o Chatwoot enviar o contexto da conversa...</div>
  <div id="debug" class="debug"></div>

<script>
  // Lê o client_id da própria URL com que este painel foi registrado no Chatwoot,
  // ex: https://painel-crm.srv1885364.hstgr.cloud/?client=ww-assessoria
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('client');

  const conteudo = document.getElementById('conteudo');
  const debugEl = document.getElementById('debug');
  const MOSTRAR_DEBUG = params.get('debug') === '1';

  function mostrarDebug(dado) {
    if (MOSTRAR_DEBUG) {
      debugEl.textContent = 'Debug (payload recebido do Chatwoot):\n' + JSON.stringify(dado, null, 2);
    }
  }

  function ehJsonValido(texto) {
    if (typeof texto !== 'string') return false;
    try {
      JSON.parse(texto);
      return true;
    } catch {
      return false;
    }
  }

  function escapeHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto ?? '';
    return div.innerHTML;
  }

  function extrairContato(payload) {
    // Formato confirmado na documentação do Chatwoot:
    // { "event": "appContext", "data": { "conversation": {...}, "contact": {...}, "currentAgent": {...} } }
    // O Chatwoot manda contato tanto em data.contact quanto em data.conversation.meta.sender
    // (varia conforme a versão/canal), então checamos os dois. Também cobre camelCase
    // (app mobile manda inboxId/phoneNumber em vez de inbox_id/phone_number).
    const d = payload?.data ?? payload;
    const contact = d?.contact ?? d?.conversation?.meta?.sender ?? d?.currentConversation?.meta?.sender;
    if (!contact) return null;
    // Confirmado ao vivo (16/08): contatos criados pela ponte WhatsApp (Channel::Api)
    // guardam o telefone em "identifier", não em "phone_number" -- esse campo só vem
    // preenchido em canais WhatsApp nativos do Chatwoot, que não é o nosso caso.
    return {
      nome: contact.name || null,
      phone: contact.phone_number || contact.phoneNumber || contact.identifier || null,
      email: contact.email || null
    };
  }

  function mostrarIframe(url) {
    document.body.classList.add('modo-iframe');
    conteudo.innerHTML = `<iframe class="twenty-frame" src="${url}"></iframe>`;
  }

  function urlListaPeople(linkDeExemplo) {
    return linkDeExemplo.replace(/\/object\/person\/.*$/, '/objects/people');
  }

  function mostrarDuplicados(matches) {
    document.body.classList.remove('modo-iframe');
    const itens = matches
      .map(
        (m) =>
          `<li>${escapeHtml(m.nome)} — <a href="${m.linkTwenty}" target="_blank" rel="noopener">abrir no Twenty →</a></li>`
      )
      .join('');
    conteudo.innerHTML = `
      <div class="card">
        <ul class="lista-duplicados">${itens}</ul>
        <div class="aviso">
          Múltiplos contatos encontrados com esse telefone. Use a função de Merge do
          Twenty: selecione os registros na
          <a href="${urlListaPeople(matches[0].linkTwenty)}" target="_blank" rel="noopener">lista de People</a>
          e escolha Mesclar.
        </div>
      </div>
    `;
  }

  function mostrarBotaoCadastrar(nome, phone) {
    document.body.classList.remove('modo-iframe');

    if (!phone) {
      conteudo.innerHTML = `
        <div class="card">
          <div class="estado">Nenhum contato encontrado no Twenty CRM e este contato não tem telefone identificado — cadastre manualmente.</div>
        </div>
      `;
      return;
    }

    conteudo.innerHTML = `
      <div class="card">
        <div class="estado" style="margin-bottom: 12px;">Nenhum contato encontrado no Twenty CRM.</div>
        <button id="btnCadastrar" class="botao">Cadastrar no Twenty CRM</button>
      </div>
    `;

    document.getElementById('btnCadastrar').addEventListener('click', async (ev) => {
      const btn = ev.target;
      btn.disabled = true;
      btn.textContent = 'Cadastrando...';
      try {
        const resp = await fetch('/api/contact/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client: clientId, nome: nome || 'Sem nome', telefone: phone })
        });
        const dado = await resp.json();
        if (!resp.ok) {
          conteudo.innerHTML = `<div class="estado">Erro ao cadastrar: ${escapeHtml(dado.error || String(resp.status))}</div>`;
          return;
        }
        mostrarIframe(dado.linkTwenty);
      } catch (e) {
        conteudo.innerHTML = `<div class="estado">Erro ao cadastrar: ${escapeHtml(e.message)}</div>`;
      }
    });
  }

  async function buscarContato(nome, phone, email) {
    if (!clientId) {
      document.body.classList.remove('modo-iframe');
      conteudo.textContent = 'Erro: URL do painel não tem o parâmetro ?client=... configurado.';
      return;
    }
    const qs = new URLSearchParams({ client: clientId });
    if (phone) qs.set('phone', phone);
    if (email) qs.set('email', email);

    document.body.classList.remove('modo-iframe');
    conteudo.textContent = 'Buscando no Twenty CRM...';

    try {
      const resp = await fetch('/api/contact?' + qs.toString());
      const dado = await resp.json();

      if (!resp.ok) {
        conteudo.textContent = dado.error || 'Erro ao buscar contato.';
        return;
      }

      const matches = dado.matches || [];

      if (matches.length === 0) {
        mostrarBotaoCadastrar(nome, phone);
      } else if (matches.length === 1) {
        mostrarIframe(matches[0].linkTwenty);
      } else {
        mostrarDuplicados(matches);
      }
    } catch (e) {
      conteudo.textContent = 'Erro ao consultar o painel: ' + e.message;
    }
  }

  window.addEventListener('message', (event) => {
    // O Chatwoot manda event.data como STRING JSON, não como objeto direto.
    // (Além disso, o navegador pode entregar mensagens de outras origens, como
    // extensões do Chrome -- por isso o filtro ehJsonValido antes de qualquer coisa.)
    if (!ehJsonValido(event.data)) {
      mostrarDebug({ ignorado_nao_json: event.data });
      return;
    }
    const eventData = JSON.parse(event.data);
    mostrarDebug(eventData);

    if (eventData.event !== 'appContext') return;

    const contato = extrairContato(eventData);
    if (contato && (contato.phone || contato.email)) {
      buscarContato(contato.nome, contato.phone, contato.email);
    }
  });

  // Pede o contexto ativamente ao carregar: cobre o caso da aba ser aberta/recarregada
  // DEPOIS do Chatwoot já ter mandado o appContext inicial (ele não reenvia sozinho
  // nesse caso). Chatwoot responde a essa chave com o payload atualizado.
  window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
</script>
</body>
</html>
